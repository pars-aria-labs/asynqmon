name: asynqmon-demo

services:
  redis:
    image: ${DEMO_REDIS_IMAGE:-redis:7-alpine}
    command: [redis-server, --save, "", --appendonly, "no"]
    tmpfs:
      - /data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 15

  dashboard:
    build:
      context: .
    ports:
      - "127.0.0.1:${ASYNQMON_PORT:-8080}:8080"
    command:
      - --redis-addr=redis:6379
      - --enable-metrics-exporter
      - --prometheus-addr=http://prometheus:9090
    depends_on:
      redis:
        condition: service_healthy

  demo:
    build:
      context: .
      dockerfile: dev/demo.Dockerfile
    environment:
      REDIS_ADDR: redis:6379
    stop_grace_period: 15s
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: ${DEMO_PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
    volumes:
      - ./dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
    tmpfs:
      - /prometheus:mode=1777
    depends_on:
      - dashboard
