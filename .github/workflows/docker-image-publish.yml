name: Publish Docker image

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - ui/**
      - Dockerfile
      - .github/workflows/docker-image-publish.yml
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - ui/**
      - Dockerfile
      - .github/workflows/docker-image-publish.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to GHCR after a successful build
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  push_to_registry:
    name: Build Docker image${{ github.event_name == 'workflow_dispatch' && inputs.publish && ' and publish it' || '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pars-aria-labs/asynqmon
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image digest
        env:
          IMAGE_DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: echo "$IMAGE_DIGEST"
