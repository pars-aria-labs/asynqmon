name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install frontend dependencies
        working-directory: ui
        run: yarn install --frozen-lockfile

      - name: Build frontend assets
        working-directory: ui
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: yarn build

      - name: Build release archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_OS: ${{ matrix.goos }}
        run: |
          binary=asynqmon
          if [ "$TARGET_OS" = windows ]; then
            binary=asynqmon.exe
          fi
          CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o "$binary" ./cmd/asynqmon
          tar -czf "asynqmon_${RELEASE_TAG}_${TARGET_OS}_amd64.tar.gz" "$binary"

      - name: Upload release archive
        uses: softprops/action-gh-release@v3
        with:
          files: asynqmon_${{ github.event.release.tag_name }}_${{ matrix.goos }}_amd64.tar.gz
