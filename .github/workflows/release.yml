name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-ui:
    name: Build release UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build production assets
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: ui
      - name: Preserve production assets
        uses: actions/upload-artifact@v7
        with:
          name: ui-build
          path: ui/build
          if-no-files-found: error
          retention-days: 2

  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: build-ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Remove checkout assets before restoring the release build
        run: rm -rf ui/build
      - name: Restore production assets
        uses: actions/download-artifact@v8
        with:
          name: ui-build
          path: ui/build
      - name: Build and package
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME//\//-}"
          base="asynqmon_${tag}_${TARGET_OS}_${TARGET_ARCH}"
          package_dir="dist/${base}"
          mkdir -p "$package_dir"

          binary="asynqmon"
          if [[ "$TARGET_OS" == "windows" ]]; then
            binary="asynqmon.exe"
          fi
          CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" \
            go build -trimpath -ldflags="-s -w" \
            -o "$package_dir/$binary" ./cmd/asynqmon
          cp LICENSE README.md "$package_dir/"

          if [[ "$TARGET_OS" == "windows" ]]; then
            (cd dist && zip -qr "${base}.zip" "$base")
          else
            tar -C dist -czf "dist/${base}.tar.gz" "$base"
          fi
          rm -rf "$package_dir"
      - name: Preserve release package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  publish-binaries:
    name: Publish binaries and provenance
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Restore release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum asynqmon_* > checksums.txt
          sha256sum --check checksums.txt
      - name: Create build-provenance attestation
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
      - name: Upload assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-container:
    name: Publish multi-platform container
    needs: publish-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare image tags
        id: image
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME//[^A-Za-z0-9_.-]/-}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9_] ]]; then
            tag="v${tag}"
          fi
          tag="${tag:0:128}"
          {
            echo "name=$image"
            echo "tags<<EOF"
            echo "$image:$tag"
            if [[ "$IS_PRERELEASE" == "false" ]]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push amd64/arm64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,mode=max,scope=release-container
          provenance: mode=max
          sbom: true
      - name: Create image-provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
