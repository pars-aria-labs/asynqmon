name: Test

on:
  workflow_call:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-and-library:
    name: UI and Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install UI dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ui
      - name: Run UI tests and production build
        run: npm test && npm run build
        working-directory: ui
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: Run browser tests
        run: npm run test:e2e
        working-directory: ui
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-diagnostics
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run Go race tests
        run: go test -race -count=1 ./...
        env:
          ASYNQMON_TEST_REDIS_ADDR: 127.0.0.1:6379
      - name: Run Go static analysis
        run: go vet ./...

  container-build:
    name: Container smoke (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build target-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: asynqmon:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Run target-platform image
        env:
          IMAGE: asynqmon:ci-${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          container_id="$(docker run --detach --platform "$PLATFORM" \
            --add-host=host.docker.internal:host-gateway \
            --publish 127.0.0.1:18080:8080 \
            "$IMAGE" --redis-addr=host.docker.internal:6379)"
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for _attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/queues >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
