# Combine with compose.demo.yaml; uses host-built Linux executables.
services:
  dashboard:
    build:
      context: .
      dockerfile: dev/prebuilt.Dockerfile
      args:
        BINARY: dev/bin/dashboard
  demo:
    build:
      context: .
      dockerfile: dev/prebuilt.Dockerfile
      args:
        BINARY: dev/bin/demo
